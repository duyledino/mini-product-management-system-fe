<div class="bg-white">
  <div class="mx-auto max-w-7xl px-4 py-16">
    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-bold text-gray-900">Customers also purchased</h2>
@if (isAdminOrManager()) {
      <button (click)="isModalOpen.set(true)" class="btn btn-primary btn-md w-[200px]">
        Create Product
      </button>
    }
    </div>

    <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4">
      @if (products.length == 0) {
        <p class="text-center text-gray-500 col-span-4">No products found</p>
      }@else {
        @for (item of products; track item.id) {
          <app-product-item [product]="item"></app-product-item>
        }
      } 
    </div>
    
    @if (isLoading()) {
      <div class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
      </div>
    }
  </div>
</div>

@if (isModalOpen()) {
  <app-product-modal 
    [product]="null" 
    (close)="isModalOpen.set(false)"
    (save)="handleSave($event)">
  </app-product-modal>
}
