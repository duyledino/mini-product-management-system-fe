<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
    
    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
      <h3 class="text-2xl font-bold text-gray-900">
        {{ product ? 'Update Product' : 'Create New Product' }}
      </h3>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 cursor-pointer text-2xl">&times;</button>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Product Name</label>
        <input formControlName="name" type="text" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="3" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Price ($)</label>
          <input formControlName="price" type="number" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" formControlName="public" class="w-5 h-5 text-indigo-600 rounded">
            <span class="ml-2 text-sm font-medium text-gray-700">Make Public</span>
          </label>
        </div>
        <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Stock Quantity</label>
        <input formControlName="stockQuantity" type="number" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      </div>

      <div class="flex gap-3 mt-8">
        <button type="button" (click)="close.emit()" class="flex-1 px-6 py-3 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50 transition-all cursor-pointer">
          Cancel
        </button>
        <button type="submit" [disabled]="productForm.invalid" class="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 disabled:opacity-50 transition-all cursor-pointer">
          {{ product ? 'Save Changes' : 'Create Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
