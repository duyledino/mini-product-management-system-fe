<nav class="bg-indigo-600 text-white shadow-md font-sans">

    <div class="flex items-center justify-between h-16">
      
      <div class="shrink-0">
        <a routerLink="/" class="text-xl font-bold tracking-wider hover:text-indigo-200 transition-colors">
          MiniPMS 🚀
        </a>
      </div>

      <div class="flex space-x-2 sm:space-x-4">
        @if(authStore.isAuthenticated()){
          <a routerLink="/product"

           Product
        </a>

        <a routerLink="/cart" 
           class="block relative px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors">
           🛒 Cart

              <span class="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">{{ cartCount() }}</span>

        </a>

        <a routerLink="/profile" 
           class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors">
           👤 Profile
        </a>
        @if (isAdmin()) {
          <a routerLink="/admin" 
             class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors">
             🛡️ Admin
          </a>
        }
        }
        <a routerLink="/" 
           class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors">
           Home
        </a>
        @if (!authStore.isAuthenticated()) {
          <a routerLink="/login" 
           class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors">
           Login
        </a>
        <a routerLink="/register" 
           class="px-3 py-2 rounded-md text-sm font-medium bg-white text-indigo-600 hover:bg-gray-100 transition-colors">
